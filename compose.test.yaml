name: clash-armies-test
services:
  db:
    image: mariadb:12.3
    ports:
      - ${DB_PORT:?}:3306
    environment:
      MARIADB_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:?}
      MARIADB_USER: ${DB_USER:?}
      MARIADB_PASSWORD: ${DB_PASSWORD:?}
      MARIADB_DATABASE: clash-armies
      # Runs `mariadb-upgrade`, which is recommended after major releases (https://mariadb.com/docs/server/clients-and-utilities/deployment-tools/mariadb-upgrade)
      MARIADB_AUTO_UPGRADE: 1
    volumes:
      - clash-armies-test-db:/var/lib/mysql
volumes:
  clash-armies-test-db: {}
